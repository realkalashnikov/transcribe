name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Transcriber & Exporter Tests
        run: |
          python test_app.py

      - name: Test FastAPI Static Files & API Endpoints
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; c = TestClient(app); r = c.get('/'); assert r.status_code == 200; r2 = c.get('/api/info'); assert r2.status_code == 200; r3 = c.get('/api/history'); assert r3.status_code == 200; print('All endpoint assertions passed!')"
